<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер</title>
<style>
/* Основной контейнер слайдера */
.slider {
            width: 100%; /* Занимает всю доступную ширину */
            max-width: 600px; /* Ограничиваем максимальную ширину */
            overflow: hidden; /* Скрываем выходящие за границы элементы */
            position: relative; /* Позволяет позиционировать кнопки поверх */
            margin: auto; /* Центрируем слайдер на странице */
            text-align: center; /* Центрируем подписи под слайдами */
        }

        /* Контейнер, который содержит все слайды */
        .slides {
            display: flex; /* Располагаем слайды в одну линию */
            transition: transform 0.5s ease-in-out; /* Плавное перелистывание */
        }

        /* Каждый отдельный слайд */
        .slide {
            flex-shrink: 0; /* Запрещаем уменьшение слайдов */
            width: 100%; /* Каждый слайд занимает всю ширину контейнера */
            position: relative; /* Для позиционирования подписей */
        }

        /* Изображения слайдов */
        .slide img {
            width: 100%; /* Картинка заполняет всю ширину контейнера */
            height: auto; /* Сохраняет пропорции */
            display: block; /* Убираем отступы снизу */
        }

        /* Подписи к слайдам */
        .caption {
            position: absolute; /* Размещаем поверх изображения */
            bottom: 10px; /* Отступ от нижнего края */
            left: 50%; /* Центрируем по горизонтали */
            transform: translateX(-50%); /* Корректируем смещение влево на 50% ширины */
            background: rgba(0, 0, 0, 0.6); /* Полупрозрачный черный фон */
            color: white; /* Белый текст */
            padding: 5px 10px; /* Отступы */
            font-size: 14px; /* Размер шрифта */
            border-radius: 5px; /* Скругляем углы */
        }

        /* Кнопки "Назад" и "Вперед" */
        .prev, .next {
            position: absolute; /* Размещаем поверх слайдов */
            top: 50%; /* Выравниваем по вертикали */
            transform: translateY(-50%); /* Смещаем вверх для точного центрирования */
            background: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон */
            color: white; /* Белый текст */
            border: none; /* Без границ */
            padding: 10px; /* Внутренние отступы */
            cursor: pointer; /* Курсор в виде указателя */
            font-size: 18px; /* Увеличиваем размер текста */
            font-weight: bold; /* Делаем текст жирным */
            z-index: 2; /* Размещаем поверх всех элементов */
        }

        /* Позиционируем кнопку "Назад" слева */
        .prev {
            left: 10px;
        }

        /* Позиционируем кнопку "Вперед" справа */
        .next {
            right: 10px;
        }

        /* Адаптивные стили для мобильных устройств */
        @media (max-width: 480px) {
            .slider {
                max-width: 100%; /* Растягиваем слайдер на всю ширину экрана */
            }

            .prev, .next {
                padding: 5px; /* Уменьшаем размер кнопок */
                font-size: 14px; /* Делаем шрифт поменьше */
            }

            .caption {
                font-size: 12px; /* Уменьшаем текст подписи */
                padding: 3px 6px; /* Уменьшаем отступы */
            }
        }
        
        /* Контейнер для точек управления (индикаторов) */
        .controls {
            text-align: center; /* Размещаем точки по центру */
            margin-top: 10px; /* Добавляем отступ сверху */
        }

        /* Стиль для точек переключения */
        .controls label {
            display: inline-block; /* Размещаем точки в строку */
            width: 50px; /* Размер точки */
            height: 50px;
            background: gray; /* Серый цвет точки */
            /*border-radius: 50%; /* Делаем точки круглыми */
            margin: 5px; /* Добавляем небольшой отступ между ними */
            cursor: pointer; /* Делаем курсор в виде руки при наведении */
        }

        .controls label img {
          width: 100%;
          height: 100%;
        }

        .active {
          border: 3px solid red
        }
</style>

<script>
/**
 * Слайдер с превью, стрелками, автопрокруткой
 */
const slides = document.querySelector('.slides')
const slideCount = document.querySelectorAll('.slide').length // Количество слайдов
const prevButton = document.querySelector('.prev')
const nextButton = document.querySelector('.next')
const slider = document.querySelector('.slider')
let productPreviews = document.querySelectorAll('.preview') // массив превью картинок

let currentIndex = 0 // Текущий индекс слайда
let autoPlayInterval // Интервал для автопрокрутки

/* Функция смены слайда. @param {number} index - Индекс слайда, на который нужно перейти. */
function goToSlide(index) {
    var current_img = document.querySelector('[data-image="'+currentIndex+'"]')
    var current_preview = document.querySelector('[data-preview="'+currentIndex+'"]')

    var index = index % slideCount
    if (index < 0) {index = index + slideCount}

    var new_img = document.querySelector('[data-image="'+index+'"]')
    var new_preview = document.querySelector('[data-preview="'+index+'"]')

    currentIndex = index
    slides.style.transform = `translateX(${-index * 100}%)` // Смещение слайдов
    current_preview.classList.remove('active')
    new_preview.classList.add('active')
}

// Запускает автоматическая прокрутку слайдов.
function startAutoPlay() {
    autoPlayInterval = setInterval(() => goToSlide(currentIndex + 1), 3000)
}
//Останавливает автоматическую прокрутку.
function stopAutoPlay() {
    clearInterval(autoPlayInterval)
}

// Обработчик кликов на превью
productPreviews.forEach(function (img) {
    img.onclick = function(e) {
    var image_id = e.target.getAttribute('data-preview')
    goToSlide(image_id)
  }
})

// Обработчики кликов для кнопок
prevButton.addEventListener('click', () => goToSlide(currentIndex - 1))
nextButton.addEventListener('click', () => goToSlide(currentIndex + 1))

startAutoPlay(); // Запускаем автопрокрутку
slider.addEventListener('mouseenter', stopAutoPlay) // Остановка при наведении мыши
slider.addEventListener('mouseleave', startAutoPlay) // Возобновление при уходе мыши
